name: Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build offline landscape APK
        run: gradle -p android assembleDebug lintDebug --no-daemon
      - name: Validate APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-info.txt
          unzip -l "$APK" | grep 'assets/index.html'
          unzip -l "$APK" | grep 'assets/assets/.*glb'
          cp "$APK" Foldlight-Android-Landscape.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Foldlight-Android-Landscape
          path: |
            Foldlight-Android-Landscape.apk
            apk-info.txt
            android/app/build/reports/lint-results-debug.html
