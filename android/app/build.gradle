plugins { id 'com.android.application' }
android {
    namespace 'com.foldlight.playtest'
    compileSdk 35
    defaultConfig {
        applicationId 'com.foldlight.playtest'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2-joystick'
    }
    sourceSets.main.assets.srcDirs = [layout.buildDirectory.dir('gameAssets')]
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
tasks.register('copyGameAssets', Sync) {
    from('../..') {
        include '*.js', '*.html', '*.css', 'assets/**', 'vendor/**'
    }
    into layout.buildDirectory.dir('gameAssets')
}
tasks.named('preBuild').configure { dependsOn 'copyGameAssets' }


