<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101e25"><title>折光遗迹 · 浏览器版</title><link rel="stylesheet" href="style.css"></head>
<body>
<canvas id="scene" aria-label="折光遗迹三维游戏场景"></canvas>
<div id="loading">正在唤醒遗迹…</div>
<header><a id="brand" href="#" aria-label="返回主菜单"><span class="brand-icon">◈</span> 折光遗迹 <small>FOLDLIGHT</small></a><div class="top-actions"><button id="sound" title="切换音效">音效 · 开</button><button id="settings">灵敏度</button><button id="help">操作说明</button><button id="pause">暂停 <kbd>Esc</kbd></button></div></header>
<main id="menu" class="overlay">
 <div class="intro"><div class="eyebrow">A JOURNEY BETWEEN DIMENSIONS</div><h1>世界的另一面，<br><em>就在一念之间。</em></h1><p>将远近折成一条路，让余烬升成一道光。<br>在三维与二维之间，寻找遗迹的出口。</p><div class="campaigns" id="campaigns"></div><div class="menu-actions"><button class="primary" id="start">从头开始 <span>↗</span></button><button id="continue" hidden>继续存档</button><button id="select">选择关卡</button></div><div class="menu-note" id="saved">本地独立存档 · 无需安装游戏客户端</div></div>
 <div class="scene-caption"><span>01 / 折叠空间</span><b>距离，未必是距离。</b><small>浏览器移植版 · 原项目关卡与机制</small></div>
</main>
<section id="hud" hidden><div class="objective"><div class="eyebrow" id="chapter"></div><h2 id="roomname"></h2><p id="objective"></p><div id="tasks"></div></div><div class="dimension"><b id="mode">3D</b><div><span id="direction">南视</span><small id="spell">火印</small></div><div class="compass"><button data-action="q" aria-label="上一方向">‹</button><span id="compassName">南</span><button data-action="e" aria-label="下一方向">›</button></div></div><div id="toast" role="status"></div><div class="desktop-controls"><span>鼠标转视角</span><span><kbd>W A S D</kbd> 移动</span><span><kbd>Space</kbd> 跳跃</span><button data-action="v"><kbd>V</kbd> 折叠</button><button data-action="f"><kbd>F</kbd> 施法</button><button data-action="g"><kbd>G</kbd> 交互</button><button data-action="tab"><kbd>Tab</kbd> 冰火</button><button data-action="h"><kbd>H</kbd> 提示</button><button data-action="r"><kbd>R</kbd> 重试</button></div><div id="touch"><div class="dpad"><button data-hold="w" aria-label="前进">↑</button><button data-hold="a" aria-label="左移">←</button><button data-hold="s" aria-label="后退">↓</button><button data-hold="d" aria-label="右移">→</button></div><div class="touch-actions"><button data-action="tab">冰 / 火</button><button data-action="g">交互</button><button data-action="v">折叠</button><button data-hold="f">施法</button><button data-action="space" class="jump">跳跃</button></div></div></section>
<dialog id="dialog"><button id="close" class="close" aria-label="关闭">×</button><div id="dialogContent"></div></dialog>
<script type="module" src="app.js?v=touch1"></script>
</body></html>
